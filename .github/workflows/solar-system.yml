name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: mongodb://localhost:27017/solar-system?authSource=admin
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
    
jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        services:
          mongo:
            image: mongo:7.0
            ports:
              - 27017:27017
            env:
              MONGO_INITDB_ROOT_USERNAME: superuser
              MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
            options: >-
              --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 10
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version
          uses: actions/setup-node@v4
          with:
            node-version: 20
    
        - name: Seed MongoDB with planet data
          run: |
            docker exec -i ${{ job.services.mongo.id }} mongoimport \
              --username "$MONGO_USERNAME" --password "$MONGO_PASSWORD" \
              --authenticationDatabase admin \
              --db solar-system --collection planets --jsonArray --drop \
              < test-data/planets.json

        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml