name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: mongodb://localhost:27017/solar-system?authSource=admin
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    strategy:
      fail-fast: false
      matrix:
        nodejs_version: [18, 19, 20]
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: superuser
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Cache NPM Dependencies 
        uses: actions/cache@v6
        with:
          path: node_modules 
          key: ${{ runner.os }}-node-${{ matrix.nodejs_version }}-modules-${{ hashFiles('package-lock.json')}}
         
      - name: Seed MongoDB with planet data
        run: |
          docker exec -i ${{ job.services.mongo.id }} mongoimport \
            --username "$MONGO_USERNAME" --password "$MONGO_PASSWORD" \
            --authenticationDatabase admin \
            --db solar-system --collection planets --jsonArray --drop \
            < test-data/planets.json

      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        id: nodejs-unit-testing-step
        run: npm test

      - name: Archive Test Result
        if: steps.nodejs-unit-testing-step.outcome == 'failure' || steps.nodejs-unit-testing-step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-ubuntu-node${{ matrix.nodejs_version }}
          path: test-results.xml

  # macOS runners have no Docker, so `services:` can't be used there.
  # MongoDB is installed natively with Homebrew instead.
  unit-testing-macos:
    name: Unit Testing (macOS)
    strategy:
      fail-fast: false
      matrix:
        nodejs_version: [19, 20]
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Cache NPM Dependencies 
        uses: actions/cache@v6
        with:
          path: node_modules 
          key: ${{ runner.os }}-node-${{ matrix.nodejs_version }}-modules-${{ hashFiles('package-lock.json')}}

      - name: Install and start MongoDB
        run: |
          brew tap mongodb/brew
          brew install mongodb-community@7.0 mongosh mongodb-database-tools
          brew services start mongodb/brew/mongodb-community@7.0
          for i in $(seq 1 30); do
            mongosh --quiet --eval 'db.runCommand({ ping: 1 })' && break
            sleep 2
          done

      - name: Create MongoDB user
        run: |
          mongosh admin --quiet --eval "db.createUser({ user: '$MONGO_USERNAME', pwd: '$MONGO_PASSWORD', roles: ['root'] })"

      - name: Seed MongoDB with planet data
        run: |
          mongoimport \
            --username "$MONGO_USERNAME" --password "$MONGO_PASSWORD" \
            --authenticationDatabase admin \
            --db solar-system --collection planets --jsonArray --drop \
            --file test-data/planets.json

      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        id: nodejs-unit-testing-step
        run: npm test

      - name: Archive Test Result
        if: steps.nodejs-unit-testing-step.outcome == 'failure' || steps.nodejs-unit-testing-step.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-macos-node${{ matrix.nodejs_version }}
          path: test-results.xml

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: superuser
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version - 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache NPM Dependencies 
        uses: actions/cache@v6
        with:
          path: node_modules 
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json')}}
          
      - name: Seed MongoDB with planet data
        run: |
          docker exec -i ${{ job.services.mongo.id }} mongoimport \
            --username "$MONGO_USERNAME" --password "$MONGO_PASSWORD" \
            --authenticationDatabase admin \
            --db solar-system --collection planets --jsonArray --drop \
            < test-data/planets.json

      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive Test Result
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5
